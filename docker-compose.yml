services:
  cognee-postgres:
    image: postgres:16
    container_name: cognee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee_db
    volumes:
      - cognee_pg_data:/var/lib/postgresql/data
    networks:
      - cognee_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  cognee-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognee-mcp-fastembed
    container_name: cognee-mcp
    restart: unless-stopped
    user: root
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cognee-postgres:
        condition: service_healthy
    environment:
      EXTRAS: "fastembed,anthropic,postgres"
      TRANSPORT_MODE: "http"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      LLM_API_KEY: "89c914cacdfd483ea87ee6183ad9698b.K3I1LsV9u2GVseBNmXYMU2dd"
      LLM_PROVIDER: "ollama"
      LLM_MODEL: "minimax-m3"
      LLM_ENDPOINT: "https://ollama.com/v1"
      EMBEDDING_PROVIDER: "fastembed"
      EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      EMBEDDING_DIMENSIONS: "384"
      DB_PROVIDER: "postgres"
      DB_HOST: "cognee-postgres"
      DB_PORT: "5432"
      DB_USERNAME: "cognee"
      DB_PASSWORD: "cognee"
      DB_NAME: "cognee_db"
    volumes:
      - cognee_data:/app/.venv/lib/python3.12/site-packages/cognee/.cognee_system
    networks:
      - cognee_internal
      - n8n_n8n_network
    labels:
      caddy: cognee.maarin.dedyn.io
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.reverse_proxy.flush_interval: "-1"
      caddy.reverse_proxy.header_up: "Host localhost:8000"
      caddy.reverse_proxy.transport: "http"
      caddy.reverse_proxy.transport.read_timeout: "300s"
      caddy.reverse_proxy.transport.write_timeout: "300s"
      caddy.reverse_proxy.transport.response_header_timeout: "300s"

volumes:
  cognee_data:
  cognee_pg_data:

networks:
  cognee_internal:
    driver: bridge
  n8n_n8n_network:
    external: true
